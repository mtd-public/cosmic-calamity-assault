name: Build pk3 and GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Node builder (zdbsp)
        run: sudo apt-get update -q && sudo apt-get install -y -q zdbsp
      # The maps are compiled from maps-src/ and must prove completable
      # (exit, keys, objectives, monsters reachable) or this step fails.
      - name: Compile + validate maps
        run: node tools/mapc.mjs
      # Packs mod/ into the pk3 and checks the asset contract (docs/ASSETS.md):
      # unknown map things fail; missing art is reported.
      - name: Build pk3
        run: node tools/build.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp dist/cosmic-calamity-assault.pk3 _site/
          touch _site/.nojekyll
      # The previous three.js Halo-like game stays playable at /halo-like/.
      - uses: actions/checkout@v4
        with:
          ref: final-halo-like
          path: legacy
      - name: Add the Halo-like prototype
        run: |
          mkdir -p _site/halo-like
          cp legacy/index.html legacy/manifest.webmanifest legacy/sw.js _site/halo-like/
          cp -r legacy/css legacy/js legacy/touch-zoom-guard _site/halo-like/
          rm -rf _site/halo-like/touch-zoom-guard/test
      # Deploy only from main: the github-pages environment admits main only
      # (feature-branch deploys are rejected and turn PRs red).
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  # Real-engine tests: GZDoom 4.14.2 built from source (cached), run headless
  # under Xvfb with Freedoom 2: every map loads with no script/actor errors,
  # and every map's objective chain plays through to the exit.
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build libsdl2-dev libvpx-dev libwebp-dev libgl-dev libopenal-dev libfluidsynth-dev freedoom zdbsp xvfb mesa-utils libgl1-mesa-dri
      - name: Cache GZDoom build
        id: gzcache
        uses: actions/cache@v4
        with:
          path: ~/gz
          key: gzdoom-g4.14.2-zmusic-1.1.14-${{ runner.os }}
      - name: Build ZMusic + GZDoom
        if: steps.gzcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/gz && cd ~/gz
          git clone -q --depth 1 --branch 1.1.14 https://github.com/ZDoom/ZMusic
          git clone -q --depth 1 --branch g4.14.2 https://github.com/ZDoom/gzdoom
          cmake -S ZMusic -B ZMusic/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/gz/zmusic-install
          cmake --build ZMusic/build && cmake --install ZMusic/build
          cmake -S gzdoom -B gzdoom/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNO_GTK=ON -DCMAKE_PREFIX_PATH=$HOME/gz/zmusic-install
          cmake --build gzdoom/build
          rm -rf gzdoom/build/CMakeFiles ZMusic/build
      - name: Smoke (every map loads clean)
        env:
          LD_LIBRARY_PATH: /home/runner/gz/zmusic-install/lib
          GZDOOM: /home/runner/gz/gzdoom/build/gzdoom
        run: tools/gz-smoke.sh
      - name: Walkthrough (every map completes in-engine)
        env:
          LD_LIBRARY_PATH: /home/runner/gz/zmusic-install/lib
          GZDOOM: /home/runner/gz/gzdoom/build/gzdoom
          SKIPBUILD: 1
        run: tools/gz-walk.sh $(ls mod/maps | sed 's/\.wad$//' | tr a-z A-Z)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-shots
          path: shots/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, engine-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
