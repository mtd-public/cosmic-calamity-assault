name: Build pk3 and GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Node builder (zdbsp)
        run: sudo apt-get update -q && sudo apt-get install -y -q zdbsp
      # The maps are compiled from maps-src/ and must prove completable
      # (exit, keys, objectives, monsters reachable) or this step fails.
      - name: Compile + validate maps
        run: node tools/mapc.mjs
      # Packs mod/ into the pk3 and checks the asset contract (docs/ASSETS.md):
      # unknown map things fail; missing art is reported.
      - name: Build pk3
        run: node tools/build.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp dist/cosmic-calamity-assault.pk3 _site/
          touch _site/.nojekyll
      # The previous three.js Halo-like game stays playable at /halo-like/.
      - uses: actions/checkout@v4
        with:
          ref: final-halo-like
          path: legacy
      - name: Add the Halo-like prototype
        run: |
          mkdir -p _site/halo-like
          cp legacy/index.html legacy/manifest.webmanifest legacy/sw.js _site/halo-like/
          cp -r legacy/css legacy/js legacy/touch-zoom-guard _site/halo-like/
          rm -rf _site/halo-like/touch-zoom-guard/test
      # Deploy only from main: the github-pages environment admits main only
      # (feature-branch deploys are rejected and turn PRs red).
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
